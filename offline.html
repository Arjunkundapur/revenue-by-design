<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue by Design | GTM Engineering</title><style>html,body{margin:0;background:#f7f8fc}#host{display:block}</style></head><body><div id="host"></div><script type="module">
// Deterministic, illustrative data. No model is trained and no live CRM is accessed.
export function rng(seed=42) { let n=seed>>>0; return () => { n=(1664525*n+1013904223)>>>0; return n/4294967296; }; }
export const regions=['North America','EMEA','APAC'];
export const industries=['Software','Services','Fintech'];
export function makeAccounts() {
 const r=rng(71), first=['Aster','Northstar','Cedar','Orbit','Meridian','Harbor','Atlas','Lumen','Cobalt','Juniper'], last=['Works','Labs','Systems','Partners','Cloud','Group','Digital','Solutions','Collective','Technologies'];
 return Array.from({length:200},(_,i)=> { const fit=35+Math.floor(r()*66), intent=Math.floor(r()*101), region=regions[Math.floor(r()*3)], industry=industries[Math.floor(r()*3)];return {id:`ACC-${String(i+1).padStart(3,'0')}`,name:`${first[i%10]} ${last[Math.floor(i/10)%10]} ${i>=100?'II':''}`.trim(),fit,intent,region,industry,potential:Math.round(.65*fit+.35*intent),effort:1+Math.floor(r()*4),confidence:r()>.17?'Standard':'Review'}; });
}
export function allocate(accounts,strategy='hybrid',ramp=50) {
 const names=['Alex','Jordan','Morgan','Casey','Taylor','Sam','New hire · NA','New hire · EMEA','New hire · APAC'];
 const reps=names.map((name,i)=>({name,region:regions[i<6?Math.floor(i/2):i-6],specialty:industries[i%3],capacity:i<6?75:75*ramp/100,existing:i<6?20+(i%3)*5:0,effort:0,potential:0,accounts:[],incoming:i>=6}));
 const assignments=[], unassigned=[];
 [...accounts].sort((a,b)=>b.potential-a.potential||a.id.localeCompare(b.id)).forEach(a=>{
 let eligible=reps.filter(rep=>rep.region===a.region && rep.existing+rep.effort+a.effort<=rep.capacity);
 if(strategy==='industry')eligible=eligible.filter(rep=>rep.specialty===a.industry);
 const cost=rep=>{ const load=(rep.existing+rep.effort)/Math.max(rep.capacity,1); return strategy==='geography'?load:strategy==='industry'?rep.potential/Math.max(rep.capacity-rep.existing,1):load+(rep.specialty===a.industry?-.12:0); };
 eligible.sort((a,b)=>cost(a)-cost(b)||a.name.localeCompare(b.name));
 if(!eligible.length){unassigned.push(a);return;}
 const rep=eligible[0];rep.effort+=a.effort;rep.potential+=a.potential;rep.accounts.push(a.id);
 assignments.push({...a,owner:rep.name,specialist:rep.specialty===a.industry,reason:`${a.region} coverage; ${rep.specialty===a.industry?'industry match; ':''}${a.effort} workload units fit available capacity. ${strategy==='hybrid'?'Hybrid weighs utilisation with a small specialty preference.':strategy==='industry'?'Strict industry eligibility; lowest potential per available capacity wins.':'Lowest current utilisation among eligible regional reps.'}`});
 });
 const ratios=reps.filter(x=>x.capacity>x.existing).map(x=>x.potential/(x.capacity-x.existing)), mean=ratios.reduce((a,b)=>a+b,0)/ratios.length;
 const cv=mean?Math.sqrt(ratios.reduce((a,b)=>a+(b-mean)**2,0)/ratios.length)/mean:0;
 return {reps,assignments,unassigned,cv,specialist:assignments.filter(a=>a.specialist).length};
}
export function makeLeads() {
 const r=rng(908), sources=['Paid search','Organic','Partner','Event'];
 const base=Array.from({length:360},(_,i)=> {const fit=20+Math.floor(r()*81), engagement=Math.floor(r()*101), age=15+Math.floor(r()*166), source=sources[Math.floor(r()*4)], prob=.04+.36*(fit/100)+.2*(engagement/100); const converted=r()<prob && age>=60;return {id:`LEAD-${String(i+1).padStart(3,'0')}`,accountId:`HIST-${String(i+1).padStart(3,'0')}`,name:`Historical account ${String(i+1).padStart(3,'0')}`,fit,engagement,age,source,rawSource:source==='Paid search'?(i%2?'Paid search':'paid_search'):source==='Organic'?(i%3?'Organic':'SEO'):source,converted,oldScore:Math.round(.3*fit+.7*engagement),missing:i%17===0,duplicate:false};});
 return [...base,...base.filter((_,i)=>i%20===0).map(x=>({...x,id:`${x.id}-DUP`,duplicate:true}))];
}
export function evaluateLeads(leads,{threshold=65,weight=65,source='All sources',clean=true,mature=true}={}) {
 let sample=leads.filter(x=>(source==='All sources'||(clean?x.source:x.rawSource)===source)&&(!mature||x.age>=60));
 if(clean){const seen=new Set();sample=sample.filter(x=>{if(seen.has(x.accountId))return false;seen.add(x.accountId);return true;});}
 const eligible=sample.filter(x=>!x.missing), selected=eligible.filter(x=>(x.fit*weight+x.engagement*(100-weight))/100>=threshold), totalQ=eligible.filter(x=>x.converted).length, q=selected.filter(x=>x.converted).length;
 const oldSelected=eligible.filter(x=>x.oldScore>=65);
 return {sample,eligible,selected,q,totalQ,oldSelected,review:sample.filter(x=>x.missing),precision:selected.length?q/selected.length:0,coverage:totalQ?q/totalQ:0};
}
export function makeOpportunities(){const r=rng(31);return Array.from({length:48},(_,i)=>({id:`OPP-${String(i+1).padStart(3,'0')}`,name:`Portfolio opportunity ${String(i+1).padStart(2,'0')}`,amount:(15+Math.floor(r()*130))*1000,stageMissing:i%11===0,dateSuspect:i%7===0,qualificationMissing:i%9===0,owner:['Alex','Jordan','Morgan','Casey','Taylor','Sam'][i%6]}));}
export function pipelineView(opps){const issues=opps.filter(x=>x.stageMissing||x.dateSuspect||x.qualificationMissing), clean=opps.filter(x=>!issues.includes(x)),sum=xs=>xs.reduce((a,b)=>a+b.amount,0);return {total:sum(opps),screened:sum(clean),exposure:sum(issues),issues,clean};}
export function simulateSync(mode='healthy',recover=false){
 const events=[{step:'01','name':'HubSpot score published',status:'ok',detail:'Person P-104 · score 78 · version 12 · event EVT-104-12.'}];
 if(mode==='identity')return [...events,{step:'02',name:'Resolve canonical identity',status:'bad',detail:'Two candidate CRM records. Quarantine for identity review; no CRM overwrite or automatic assignment.'},{step:'03',name:'Review queue',status:'warn',detail:'Marketing Ops owns resolution. High-intent requests receive the documented manual fallback.'}];
 events.push({step:'02',name:'Resolve canonical identity',status:'ok',detail:'P-104 → Salesforce contact C-104 → account A-024. Owner authority remains in Salesforce.'});
 if(mode==='outoforder')return [...events,{step:'03',name:'Compare source version',status:'warn',detail:'Destination already has version 13. Ignore version 12; retain newer score and existing assignment.'}];
 if(mode==='stale')return [...events,{step:'03',name:'Check score freshness',status:'warn',detail:'Source score is 72 hours old; demo freshness rule is 24 hours. Request refresh and use a time-bounded review queue.'},{step:'04',name:'Routing held for review',status:'warn',detail:'No stale-score automatic route. Sales Ops handles high-intent fallback; agree an SLA in production.'}];
 if(mode==='duplicate')return [...events,{step:'03',name:'Deduplicate event',status:'ok',detail:'EVT-104-12 was already applied. Acknowledge replay; write count 0, new assignment count 0.'}];
 if(mode==='failure'){
 events.push({step:'03',name:'Write score to Salesforce',status:recover?'ok':'bad',detail:recover?'Replay after recovery succeeds. Same event ID and version; score written once.':'CRM service unavailable. Retry with bounded backoff; preserve the original event ID.'});
 if(!recover)return [...events,{step:'04',name:'Failed-event queue',status:'warn',detail:'After the retry limit, alert the integration owner. Routing remains on hold; no partial assignment.'}];
 }
 else events.push({step:'03',name:'Write score to Salesforce',status:'ok',detail:'Write score + version + source timestamp atomically where supported. Read back and reconcile.'});
 return [...events,{step:'04',name:'Evaluate routing eligibility',status:'ok',detail:'Fresh score, valid identity, regional coverage, and one eligible owner. Apply one assignment.'},{step:'05',name:'Reconcile & acknowledge',status:'ok',detail:'Source and destination versions match. Event ledger records completion; repeat delivery is safe.'}];
}

 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pct=x=>`${Math.round(x*100)}%`, money=x=>x>=1e6?`$${(x/1e6).toFixed(2)}m`:`$${Math.round(x/1000)}k`;
 const sum=xs=>xs.reduce((a,b)=>a+b.amount,0);

 const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const range=(id,label,value,min,max,suffix='')=>`<div class="field"><div class="label-row"><label for="${id}">${label}</label><output id="${id}-out">${value}${suffix}</output></div><input type="range" id="${id}" min="${min}" max="${max}" value="${value}" data-control="${id}"></div>`;

 const orbit=()=>`<div class="hero-art" aria-label="A reliable GTM engine connects identity, scoring, ownership, and reporting"><div class="orbit"><div class="orbit-ring"></div><div class="orbit-core">One reliable<br>GTM engine<small>CONNECTED BY DESIGN</small></div><div class="orbit-card n1"><span class="mini-dot"></span><div>Clean identity<small>ONE ACCOUNT. ONE RECORD.</small></div></div><div class="orbit-card n2"><span class="mini-dot"></span><div>Better signals<small>FIT + ENGAGEMENT</small></div></div><div class="orbit-card n3"><span class="mini-dot"></span><div>Clear ownership<small>CAPACITY + COVERAGE</small></div></div><div class="orbit-card n4"><span class="mini-dot"></span><div>Trusted reporting<small>EVIDENCE + CONTEXT</small></div></div></div><div class="floating-caption">SIGNAL → DECISION → FEEDBACK</div></div>`;
 function nav(page,tab='brief') {state.page=page;state.tab=tab;state.menu=false;state.selected='';render();root.scrollIntoView({block:'start',behavior:'instant'});}
 function shell(body){

 return `<div class="app-shell"><aside class="sidebar">${brand()}<div class="side-caption">THE ASSESSMENT</div><nav aria-label="Assessment navigation"><button class="nav-btn ${state.page==='overview'?'active':''}" data-nav="overview"><span class="nav-index">◈</span>The big picture</button>${scenarios.map(s=>`<button class="nav-btn ${state.page===s.id?'active':''}" data-nav="${s.id}" ${state.page===s.id?'aria-current="page"':''}><span class="nav-index">${s.number}</span>${s.label}</button>`).join('')}<div class="nav-divider"></div><button class="nav-btn ${state.page==='roadmap'?'active':''}" data-nav="roadmap"><span class="nav-index">↗</span>Implementation</button><button class="nav-btn ${state.page==='sources'?'active':''}" data-nav="sources"><span class="nav-index">≡</span>Sources & assumptions</button></nav><div class="side-bottom"><span class="status-dot"></span>Built for discussion<div class="side-note">Five decisions.<br>One connected revenue engine.<br><br>Illustrative data throughout.<br>Independent assessment submission.</div></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" data-action="menu" aria-label="Toggle navigation">☰</button><div class="breadcrumb">GTM engineer assessment <span style="color:#c4ccdb;margin:0 9px">/</span><strong>${pageName}</strong></div><div class="top-actions">${button('Download PDF ↓','data-action="pdf"','ghost')}${button('Present ↗','data-action="present"')}</div></header><div class="content">${body}<footer class="footer"><span>REVENUE BY DESIGN <span style="margin:0 8px">/</span> GTM ENGINEERING ASSESSMENT</span><span>All demo data is synthetic · ${data.reviewed}</span></footer></div></main></div>`;
 }
 function overview(){const captions=['Diagnose before rescoring','Allocate with a rationale','Report what you can defend','Preserve meaning through change','Make failure recoverable'];return `
 <section class="hero"><div class="hero-copy"><div class="eyebrow blue"><span class="status-dot" style="background:#345af4"></span>AN OPERATING SYSTEM FOR GROWTH</div><h1>Better signals.<br><em>Stronger decisions.</em></h1><p>A practical approach to five GTM challenges: make the data trustworthy, the decisions explainable, and the systems reliable.</p><div class="hero-actions">${button('Explore the decisions <span>→</span>','data-nav="quality"')}${button('Take the walkthrough ↗','data-action="present"','ghost')}</div><div class="hero-meta">5 scenarios <span style="margin:0 9px">·</span> Interactive labs <span style="margin:0 9px">·</span> A plan to execute</div></div>${orbit()}</section>
 <div class="section-head"><div><h2>Five challenges. One connected system.</h2><p>Follow the story in order, or go straight to a decision.</p></div><button class="inline-link" data-nav="roadmap">See the rollout plan ↗</button></div>
 <div class="chapter-grid">${scenarios.map((s,i)=>`<button class="chapter-card" data-nav="${s.id}"><span class="num">${s.number} /</span><span class="arrow">↗</span><h3>${s.label}</h3><p>${captions[i]}</p></button>`).join('')}</div>
 <div class="bottom-band"><div class="note-panel"><div class="eyebrow blue">THE THESIS</div><h3>Growth exposes the gaps between systems.</h3><p>Scoring, territories, forecasting, and integrations share a foundation: consistent identity, clear definitions, accountable ownership, and observable execution.</p></div><div class="note-panel dark"><div class="eyebrow light">THE CENTREPIECE</div><h3>200 accounts. Three new hires.</h3><p>Compare territory designs, change ramp capacity, and inspect why each account gets its owner.</p><button class="inline-link" style="color:#b6c8ff;margin-top:14px" data-nav="territory" data-tab="lab">Open the territory simulator →</button></div></div>`;}
 function scenarioPage(s){return `<section class="page-title"><div class="scenario-meta">${pill(`SCENARIO ${s.number}`)}<span class="eyebrow">${s.tag}</span></div><h1>${s.title}</h1><p>${s.subtitle}</p><div class="scenario-question">${s.question}</div></section><div class="tabs" role="tablist" aria-label="Scenario detail">${[['brief','Decision brief'],['lab','Interactive lab'],['plan','Execution plan'],['tradeoffs','Trade-offs & questions']].map(([id,label])=>`<button class="tab ${state.tab===id?'active':''}" role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${label}</button>`).join('')}</div><div role="tabpanel">${state.tab==='brief'?brief(s):state.tab==='plan'?plan(s):state.tab==='tradeoffs'?tradeoffs(s):lab(s)}</div>`;}
 function brief(s){return `<div class="decision-banner"><div class="eyebrow">THE RECOMMENDATION</div><div class="decision-text">${s.decision}</div></div><div class="three-grid">${s.principles.map(([title,body],i)=>`<article class="principle"><div class="step-num">0${i+1} /</div><h3>${title}</h3><p>${body}</p></article>`).join('')}</div><div class="why-box"><span class="icon">↗</span><p><strong>Why this approach.</strong> ${s.why}</p></div><div class="section-head"><div><h2>Evidence before intervention</h2><p>What I would ask for, and what each check resolves.</p></div>${button('Test the logic →','data-tab="lab"','secondary sm')}</div>${table(['Investigation','Evidence needed','Why it matters'],s.evidence.map(r=>[`<strong>${r[0]}</strong>`,r[1],r[2]]))}<div class="context-note"><div class="eyebrow">A RELEVANT LENS</div>${s.context}</div>`;}
 function plan(s){return `<div class="lab-header"><div><h2>Make the recommendation executable.</h2><p>Proposed sequence, subject to access, data volume, and stakeholder availability. Time windows are planning assumptions.</p></div></div>${table(['When','Accountable partners','Action','Exit evidence'],s.plan.map(r=>[`<strong>${r[0]}</strong>`,r[1],r[2],r[3]]))}<div class="section-head"><div><h2>Define success before launch.</h2><p>Pair the intended outcome with measures that reveal side effects.</p></div></div>${table(['Measure','What to track','Interpretation'],s.metrics.map(r=>[pill(r[0],r[0]==='Guardrails'?'amber':r[0]==='Primary'?'':'gray'),`<strong>${r[1]}</strong>`,r[2]]))}<div class="lab-note"><strong>Release discipline:</strong> agree the baseline and owner; dry-run on a snapshot; pilot in a bounded population; document rollback; review outcomes after enough time to mature.</div>`;}

 function lab(s){if(s.id==='quality')return leadLab();if(s.id==='territory')return territoryLab();if(s.id==='reliability')return reliabilityLab();if(s.id==='stages')return stagesLab();return systemsLab();}
 function leadLab(){return `<div class="lab-header"><div><h2>A threshold is a business trade-off.</h2><p>Compare a fit-weighted challenger with an illustrative engagement-heavy baseline. Labels are historical synthetic outcomes, not predicted conversion.</p></div>${pill('SYNTHETIC COHORT','gray')}</div><div class="lab-layout"><aside class="control-panel"><div class="eyebrow">CHALLENGER SETTINGS</div>${range('threshold','Routing threshold',state.threshold,20,95)}${range('weight','Fit weight',state.weight,0,100,'%')}<div class="hint" style="margin-top:-10px;margin-bottom:18px">Engagement weight = 100 − fit weight. Baseline: 30% fit + 70% engagement, threshold 65.</div>${select('source','Lead source',['All sources','Paid search','Organic','Partner','Event'],state.source)}${check('clean','Resolve duplicate identities and normalise source aliases',state.clean)}${check('mature','Only cohorts aged 60+ days',state.mature)}<div class="hint">360 unique historical accounts + 18 duplicated records. Every row represents one account-level routing episode.</div></aside><div class="lab-body" id="lab-results">${leadResults()}</div></div>`;}
 function leadResults(){const d=evaluateLeads(leads,state),oldQ=d.oldSelected.filter(x=>x.converted).length;
 const bars=[['Routed accounts',d.selected.length,d.eligible.length,''],['Qualified outcomes',d.q,d.totalQ,'teal']];
 return `<div class="metrics">${metric('Challenger queue',d.selected.length,`${d.eligible.length} eligible accounts/records`)}${metric('Observed yield',pct(d.precision),'Qualified outcomes ÷ routed queue')}${metric('Outcome coverage',pct(d.coverage),'Captured ÷ all eligible qualified outcomes')}</div><div class="chart-panel"><h3>Precision improves only if coverage survives.</h3><p class="chart-caption">${d.sample.length} ${state.clean?'unique accounts':'raw records'} in scope · ${d.review.length} missing-fit records held for review</p>${bars.map(([label,v,max,color])=>`<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill ${color}" style="width:${max?v/max*100:0}%"></div></div><span class="bar-value">${v} / ${max}</span></div>`).join('')}<div class="stat-line"><div><strong>${d.oldSelected.length}</strong>baseline queue</div><div><strong>${oldQ}</strong>baseline qualified outcomes</div><div><strong>${d.q-oldQ>=0?'+':''}${d.q-oldQ}</strong>challenger outcome difference</div></div></div><div class="lab-note ${!state.mature?'warn':''}">${state.mature?'<strong>Maturity rule:</strong> both models use the same 60+ day cohort. This is a descriptive replay, not proof that a scoring change caused the outcomes.':'<strong>Immature cohorts included:</strong> newer records have not had the same time to convert. A blended conversion rate is not a fair model comparison.'}</div>${table(['Model','Queue','Qualified','Observed yield'],[['Baseline · fixed',d.oldSelected.length,oldQ,pct(d.oldSelected.length?oldQ/d.oldSelected.length:0)],['Challenger · adjustable',d.selected.length,d.q,pct(d.precision)]])}<div class="section-head"><div><h3>Which accounts enter the queue?</h3><p>First 8 shown by challenger score; the metrics use the complete cohort.</p></div></div>${table(['Account','Source','Fit','Engagement','Score','Outcome'],[...d.selected].sort((a,b)=>(b.fit*state.weight+b.engagement*(100-state.weight))-(a.fit*state.weight+a.engagement*(100-state.weight))).slice(0,8).map(x=>[x.id,state.clean?x.source:x.rawSource,x.fit,x.engagement,Math.round((x.fit*state.weight+x.engagement*(100-state.weight))/100),x.converted?'Qualified':'Not yet qualified']))}<p class="hint">With cleaning off, alias labels do not merge and duplicate records can double-count outcomes. Missing fit remains a review queue, not an automatic rejection. Candidate weights and thresholds are hypotheses for validation.</p>`;
 }
 function territoryLab(){return `<div class="lab-header"><div><h2>The territory design workbench.</h2><p>Prioritise 200 accounts across an illustrative six-person existing team and three new hires. Regional coverage stays mandatory in every strategy.</p></div>${pill('200 UNASSIGNED ACCOUNTS','gray')}</div><div class="lab-layout"><aside class="control-panel"><div class="eyebrow">ALLOCATION CONTROLS</div>${select('strategy','Design strategy',[['geography','Geography'],['industry','Region + strict industry'],['hybrid','Hybrid · region + preference']],state.strategy)}${range('ramp','New-hire usable capacity',state.ramp,10,100,'%')}<div class="hint" style="margin-top:-9px;margin-bottom:20px">A quarter-capacity proxy. Each new hire covers one region; existing reps keep their current workload.</div><div class="field"><label>Hard constraints</label><div class="hint">Regional coverage<br>Available workload capacity<br>One owner per account<br>Priority order: highest potential first</div></div><div class="field"><label>Illustrative assumptions</label><div class="hint">Potential = 65% fit + 35% signal.<br>Workload = 1–4 units/account.<br>Full capacity = 75 units/rep.<br>Existing commitments = 20–30 units.<br>No active opportunities in this pool.</div></div><button class="inline-link" data-action="accounts-csv">Download allocation CSV ↓</button></aside><div class="lab-body" id="lab-results">${territoryResults()}</div></div>`;}
 function territoryResults(){const d=allocate(accounts,state.strategy,state.ramp),base=allocate(accounts,'geography',state.ramp);const filtered=d.assignments.filter(a=>`${a.id} ${a.name} ${a.owner} ${a.industry} ${a.region}`.toLowerCase().includes(state.search.toLowerCase()));
 const sel=d.assignments.find(a=>a.id===state.selected)||d.unassigned.find(a=>a.id===state.selected);
 return `<div class="metrics">${metric('Accounts assigned',`${d.assignments.length}<span style="font-size:15px;color:#a1abc0"> / 200</span>`,`${d.unassigned.length} remain in the priority queue`)}${metric('Specialty alignment',pct(d.assignments.length?d.specialist/d.assignments.length:0),'Share of assigned accounts with an industry match')}${metric('Opportunity imbalance',pct(d.cv),'CV of potential ÷ available capacity; lower is more balanced')}</div><div class="chart-panel"><h3>Workload after allocation</h3><p class="chart-caption">Bars show committed workload / usable capacity. Potential points are a prioritisation proxy, not forecast revenue.</p><div class="reps">${d.reps.map(r=>`<div class="rep-row ${r.incoming?'incoming':''}"><div class="rep-name">${r.name}<small>${r.region} · ${r.specialty}</small></div><div class="rep-bar"><div class="rep-existing" style="width:${r.existing/r.capacity*100}%"></div><div class="rep-new" style="width:${r.effort/r.capacity*100}%"></div></div><span class="bar-value">${r.existing+r.effort}/${Math.round(r.capacity*10)/10}</span><span class="bar-value">${r.potential} pts<small>${r.accounts.length} accts</small></span></div>`).join('')}</div><div class="legend"><span><i class="swatch gray"></i>Existing commitment</span><span><i class="swatch"></i>Assigned workload</span><span><i class="swatch violet"></i>New-hire workload</span></div></div><div class="lab-note ${d.unassigned.length?'warn':''}"><strong>${state.strategy==='industry'?'Strict industry rules narrow eligibility.':state.strategy==='hybrid'?'Hybrid keeps geography and adds a small specialty preference.':'Geography chooses the least-utilised eligible regional rep.'}</strong> ${d.unassigned.length?`${d.unassigned.length} accounts cannot fit the current rules and capacity; they remain visible for review.`:'All accounts fit the current rules and capacity.'} Geography baseline at this ramp assigns ${base.assignments.length} accounts with ${pct(base.cv)} imbalance.</div><div class="search-row"><h3 style="font-size:15px">Inspect an assignment</h3><input type="search" id="account-search" aria-label="Search assigned accounts" placeholder="Search account, rep, or region" value="${esc(state.search)}"></div><div id="assignment-table">${assignmentTable(filtered)}</div><div id="account-detail">${sel?accountDetail(sel):'<p class="hint">Select any row to see the assignment rationale. CSV export contains all 200 accounts, including the unassigned queue.</p>'}</div>${d.unassigned.length?`<details style="margin-top:18px"><summary>Unassigned review queue · ${d.unassigned.length} accounts</summary>${table(['Account','Region','Industry','Reason'],d.unassigned.map(a=>[a.id,a.region,a.industry,'No eligible rep with sufficient capacity under current rules.']))}</details>`:''}<p class="hint">Deterministic greedy heuristic; priority first, then eligible capacity. It does not prove a global optimum or assume specialisation improves win rate. Six existing reps and all capacity values are demo assumptions; the brief supplies only 200 accounts and three new hires.</p>`;
 }
 function assignmentTable(rows){return `<div class="table-wrap scroll-table"><table><thead><tr><th>Account</th><th>Segment</th><th>Potential</th><th>Owner</th></tr></thead><tbody>${rows.map(a=>`<tr class="click-row ${state.selected===a.id?'selected':''}" data-account="${a.id}" tabindex="0" aria-label="Inspect ${a.id}"><td><strong>${a.name}</strong><br><span class="subtle mono" style="font-size:9px">${a.id}</span></td><td>${a.industry}<br><span class="subtle" style="font-size:9px">${a.region}</span></td><td>${a.potential} pts<br><span class="subtle" style="font-size:9px">${a.effort} workload units</span></td><td>${a.owner}</td></tr>`).join('')||'<tr><td colspan="4">No matching assigned accounts.</td></tr>'}</tbody></table></div>`;}
 function accountDetail(a){return `<div class="account-detail"><strong>${a.id} → ${a.owner||'Review queue'}</strong><br>${a.reason||'No eligible rep with sufficient capacity.'}<br><span class="subtle">Potential ${a.potential} = rounded(0.65 × fit ${a.fit} + 0.35 × signal ${a.intent}). Data confidence: ${a.confidence}. High-priority low-confidence records need manual validation before activation.</span></div>`;}
 function reliabilityLab(){return `<div class="lab-header"><div><h2>A report with its uncertainty attached.</h2><p>A fixed synthetic snapshot of 48 opportunities. Every dollar reconciles; quality exceptions stay visible.</p></div>${pill('AS-OF SNAPSHOT','gray')}</div><div class="lab-layout"><aside class="control-panel"><div class="eyebrow">REPORTING LENS</div>${check('screened','Separate records with unresolved quality exceptions',state.screened)}${range('bound','At-risk exposure included',state.bound,0,100,'%')}<div class="hint" style="margin-top:-9px;margin-bottom:20px">A sensitivity assumption applied to the unresolved portion only. It is not a probability model.</div><div class="field"><label>Quality exceptions</label><div class="hint">Missing stage<br>Questionable close date<br>Missing qualification evidence<br><br>Issues may overlap. Exposure counts each opportunity once.</div></div><div class="field"><label>Publication contract</label><div class="hint">Open pipeline in one currency.<br>Fixed snapshot and quarter scope.<br>Changes logged after cutoff.<br>No invented stages or dates.</div></div></aside><div class="lab-body" id="lab-results">${reliabilityResults()}</div></div>`;}
 function reliabilityResults(){const d=pipelineView(opps),scenario=d.screened+d.exposure*state.bound/100;return `<div class="metrics">${metric('Total recorded pipeline',money(d.total),'All 48 opportunities, before quality screening')}${metric('Quality-screened portion',money(d.screened),`${d.clean.length} records pass the demo quality rules`)}${metric('Unresolved exposure',money(d.exposure),`${d.issues.length} distinct records with one or more exceptions`)}</div><div class="chart-panel"><h3>${state.screened?'The full picture, with quality separated.':'The aggregate alone hides what needs review.'}</h3><p class="chart-caption">${state.screened?'Screened + unresolved = total recorded pipeline. Quality-screened does not mean likely to close.':'All recorded pipeline is shown in one bar; this lens does not resolve its underlying exceptions.'}</p><div class="quality-track"><div class="supported" style="width:${state.screened?d.screened/d.total*100:100}%">${money(state.screened?d.screened:d.total)}</div>${state.screened?`<div class="uncertain" style="width:${d.exposure/d.total*100}%">${money(d.exposure)}</div>`:''}</div><div class="legend"><span><i class="swatch"></i>${state.screened?'Quality-screened':'Total recorded'}</span>${state.screened?'<span><i class="swatch" style="background:#d7a75e"></i>Unresolved exposure</span>':''}</div></div><div class="chart-panel"><h3>Decision sensitivity, not a forecast.</h3><p class="chart-caption">Assume the screened portion remains in scope, then vary how much unresolved exposure belongs in this quarter.</p><div class="stat-line"><div><strong>${money(d.screened)}</strong>0% exposure included</div><div><strong style="color:#345af4">${money(scenario)}</strong>${state.bound}% exposure included</div><div><strong>${money(d.total)}</strong>100% exposure included</div></div><p class="hint" style="margin-top:20px">These are inclusion scenarios. Neither the screened portion nor the scenario total is a calibrated bookings or revenue forecast. Stage probability and close-date validation would be additional work.</p></div><div class="lab-note"><strong>Leadership message:</strong> “We recorded ${money(d.total)} in open pipeline. ${money(d.exposure)} has unresolved quality exceptions. We are reviewing the largest affected opportunities with their owners before finalising quarter timing.”</div><div class="section-head"><div><h3>Prioritised exception register</h3><p>Largest exposure first · distinct records, with overlapping issues shown.</p></div></div>${table(['Opportunity','Amount','Exceptions','Owner'],[...d.issues].sort((a,b)=>b.amount-a.amount).map(x=>[x.id,money(x.amount),[x.stageMissing?'Missing stage':'',x.dateSuspect?'Close date suspect':'',x.qualificationMissing?'Qualification unclear':''].filter(Boolean).join(' · '),x.owner]))}`;}
 const newStages=[['Qualified','Qualified','Buyer problem, sponsor, and qualification evidence accepted.'],['Discovery','Evaluation','Customer evaluation and requirements discovery have begun.'],['Validation','Evaluation','Customer has agreed success criteria and is validating the solution.'],['Proposal','Proposal','Commercial proposal delivered against a confirmed scope.'],['Negotiation','Negotiation','Commercial or legal terms are actively being resolved.'],['Commit','Negotiation','Buyer confirms a documented decision and execution path; not a guarantee.'],['Closed','Closed','Won or lost outcome recorded explicitly; retain outcome as a separate dimension.']];
 function stagesLab(){return `<div class="lab-header"><div><h2>One operational process. A stable reporting lens.</h2><p>An illustrative crosswalk, not Rocketlane’s stage schema. Select a stage to inspect its evidence and historical implications.</p></div>${pill('SCHEMA v1 → v2','gray')}</div><div class="chart-panel"><div class="stage-map"><div><div class="eyebrow blue" style="margin-bottom:15px">NEW · 7 OPERATIONAL STAGES</div><div class="stage-column">${newStages.map((s,i)=>`<button class="stage-node ${state.stage===i?'active':''}" data-stage="${i}"><small>0${i+1}</small><span>${s[0]}</span><span class="stage-roll">${s[1]} →</span></button>`).join('')}</div></div><div class="mapping-arrows" aria-hidden="true">${Array.from({length:5},()=>'<span>→</span>').join('')}</div><div><div class="eyebrow" style="margin-bottom:15px">COMPARABLE · 5 REPORTING GROUPS</div><div class="stage-column">${['Qualified','Evaluation','Proposal','Negotiation','Closed'].map((s,i)=>`<div class="stage-node ${newStages[state.stage][1]===s?'active':''}" style="min-height:75px"><small>0${i+1}</small><span>${s}</span></div>`).join('')}</div></div></div><div id="stage-detail">${stageDetail()}</div></div><div class="three-grid"><div class="principle"><div class="step-num">PRESERVE</div><h3>Raw event history</h3><p>Store original stage, change timestamp, source, and schema version. Do not overwrite history with today’s labels.</p></div><div class="principle"><div class="step-num">COMPARE</div><h3>Versioned crosswalk</h3><p>Keep effective dates and mapping rules. Reconcile totals and show where semantics no longer match.</p></div><div class="principle"><div class="step-num">VALIDATE</div><h3>Downstream behaviour</h3><p>Test routing, automation, models, and handoffs. New-stage probabilities need fresh validation.</p></div></div><div class="lab-note warn"><strong>The irreducible trade-off:</strong> an old “Evaluation” record cannot be split into Discovery or Validation unless historical evidence supports it. Keep the old known granularity and disclose the break.</div>`;}
 function stageDetail(){const s=newStages[state.stage],split=['Evaluation','Negotiation'].includes(s[1]);return `<div class="stage-criteria"><div class="eyebrow blue" style="margin-bottom:9px">SELECTED: ${s[0].toUpperCase()}</div><h3>${s[0]} → ${s[1]}</h3><p><strong>Proposed entry evidence:</strong> ${s[2]}</p><p style="margin-top:7px"><strong>History:</strong> ${split?`New ${s[0]} records roll up to ${s[1]}. Historical ${s[1]} records stay at that original known level; do not fabricate their finer stage.`:'Comparable only if the old and new definitions genuinely match. Retain original values and version any change in meaning.'}</p></div>`;}
 function systemsLab(){return `<div class="lab-header"><div><h2>What happens when the sync fails?</h2><p>Trace one score event through identity, freshness, CRM write, and routing. This is a deterministic simulation, with no production connections.</p></div>${pill('EVENT EVT-104-12','gray')}</div><div class="lab-layout"><aside class="control-panel"><div class="eyebrow">FAILURE DRILL</div>${select('sync','Event condition',[['healthy','Healthy event'],['failure','CRM write fails'],['duplicate','Duplicate event'],['stale','Stale score'],['identity','Ambiguous identity'],['outoforder','Older event arrives late']],state.sync)}<div class="field">${button('Run / replay event →','data-action="run-sync"','square')}<div class="hint">Selecting a condition previews the outcome. Replay restarts the same event.</div></div>${state.sync==='failure'?`<div class="field">${button('Recover and retry ↻','data-action="recover"','secondary square')}<div class="hint">Simulate the CRM becoming available. Retry preserves the event ID.</div></div>`:''}<div class="field"><label>Field authority</label><div class="hint">HubSpot: fit/engagement score, version, source timestamp.<br><br>Salesforce: account/person IDs, owner, opportunity stage.<br><br>Warehouse: historical models and reconciliation; no competing field writes.</div></div></aside><div class="lab-body" id="lab-results">${systemsResults()}</div></div>`;}
 function systemsResults(){const events=simulateSync(state.sync,state.recovered),last=events.at(-1),hasBad=events.some(x=>x.status==='bad');return `<div class="chart-panel"><h3>The critical operational path</h3><div class="architecture"><div class="system-node"><div class="node-icon">◉</div><strong>HubSpot</strong><small>Score authority</small></div><div class="flow-arrow">→</div><div class="system-node"><div class="node-icon">⇄</div><strong>Sync contract</strong><small>Identity · freshness · replay</small></div><div class="flow-arrow">→</div><div class="system-node"><div class="node-icon">◇</div><strong>Salesforce</strong><small>Owner & opportunity authority</small></div></div><div class="lab-note" style="margin:0"><strong>Analytics path:</strong> source events + CRM history → warehouse → reconciled conversion reporting. The warehouse is not an unproven blocking dependency for time-sensitive routing.</div></div><div class="chart-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h3>Event trace</h3>${pill(hasBad?'NEEDS RECOVERY':last.status==='warn'?'REVIEW / NO WRITE':'HANDLED',hasBad||last.status==='warn'?'amber':'teal')}</div><div class="events">${events.map(e=>`<div class="event ${e.status}"><div class="event-dot">${e.step}</div><div><h4>${e.name}</h4><p>${e.detail}</p></div><span class="event-status">${e.status==='ok'?'PASS':e.status==='bad'?'FAIL':'HOLD'}</span></div>`).join('')}</div></div><p class="hint">Production design would verify connector support, event guarantees, API limits, access scopes, and atomicity. The example uses a 24-hour freshness rule only to make the failure mode concrete. SLA and fallback rules require business agreement.</p>`;}
 function roadmap(){return `<section class="page-title"><div class="eyebrow blue">THE IMPLEMENTATION SEQUENCE</div><h1>Stabilise. Prove. Then scale.</h1><p>Sequence the five decisions around shared foundations. A proposed 90-day plan, rather than five competing transformation projects.</p></section><div class="roadmap">${[
 ['01 / DAYS 1–14','Establish trust.','Make the critical flow and reporting baseline dependable.',['Agree qualification and identity definitions.','Freeze and reconcile the reporting snapshot.','Repair the material score-to-CRM failure.','Triage the 200-account pool and preserve active ownership.'],'Exit gate: totals reconcile; material exceptions have owners; score flow passes a failure drill.'],
 ['02 / DAYS 15–45','Test the decisions.','Pilot changes with explicit controls and review points.',['Shadow-test the scoring challenger.','Review territory scenarios and assign ramp-aware waves.','Sandbox the stage crosswalk and downstream rules.','Publish routing, freshness, and exception monitoring.'],'Exit gate: stakeholder sign-off, documented trade-offs, bounded pilots, and working rollback.'],
 ['03 / DAYS 46–90','Institutionalise it.','Scale evidence-backed improvements and make ownership durable.',['Expand territory coverage as hires become productive.','Review mature scoring and pipeline cohorts.','Cut over stages after report reconciliation.','Harden canonical history, runbooks, and service ownership.'],'Exit gate: measured outcomes, recurring reviews, and a prioritised maintenance backlog.']
 ].map(([phase,title,body,items,gate])=>`<article class="roadmap-card"><div class="eyebrow blue">${phase}</div><h2>${title}</h2><p>${body}</p><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul><div class="gate">${gate}</div></article>`).join('')}</div><div class="section-head"><div><h2>Who owns the decisions?</h2><p>One accountable sponsor per decision; engineering makes the rules operable and observable.</p></div></div>${table(['Decision','Accountable sponsor','Key partners'],[['Qualification and scoring policy','Revenue / Pipe Gen leader','Sales, Marketing, RevOps, GTM Engineering'],['Territory and account ownership','Sales leadership','Sales managers, Enablement, RevOps'],['Reporting basis and caveats','Reporting owner with Finance sign-off','Sales owners, Analytics, RevOps'],['Stage definitions and cutover','Revenue sponsor','Sales, Marketing, Finance, delivery operations'],['Integration reliability','GTM systems owner','Marketing Ops, CRM owner, Analytics']])}<div class="why-box"><span class="icon">↗</span><p><strong>Prioritisation rule:</strong> fix what can misroute a live lead or mislead a near-term decision first. Prefer a small reliable improvement with an owner over a large architecture promise without one.</p></div>`;}
 function sources(){return `<section class="page-title"><div class="eyebrow blue">EVIDENCE & ASSUMPTIONS</div><h1>Clear about what is known.</h1><p>The assignment supplies the situations. Public sources supply company context. The labs use deliberately synthetic data to make the reasoning inspectable.</p></section><div class="decision-banner"><div class="eyebrow">SCOPE OF THE CLAIMS</div><div class="decision-text">These are proposed operating decisions and working simulations. They are not claims about Rocketlane’s internal performance, CRM schema, or production architecture.</div></div><div class="method-list">${[
 ['Provided by the assessment','Five scenarios; a six-month-old score; three incoming AEs; 200 unassigned accounts; five stages becoming seven; Salesforce, HubSpot, and a warehouse in the hypothetical systems scenario.'],
 ['Assumed for the demonstrations','Six existing reps; one new hire per region; account effort and potential proxies; a 60-day lead maturity rule; a 24-hour score freshness rule; and an illustrative seven-to-five crosswalk. These need validation.'],
 ['Synthetic data methodology','Fixed-seed generators create 200 prospective accounts, 360 historical account-level lead episodes plus 18 duplicate rows, and 48 pipeline opportunities. Outcomes are generated for demonstration; they are not model predictions.'],
 ['Limits of the simulations','Territory allocation is a greedy heuristic, not a global optimum. Scoring replay is descriptive, not causal. Pipeline sensitivity is not a calibrated forecast. Sync events are simulated, not API calls.'],
 ['Validation before implementation','Check actual CRM object relationships, lead/contact conversion, parent accounts, integration licences and limits, source timestamps, and attribution definitions. Agree business owners and service expectations.'],
 ['Company relevance','Customer onboarding, professional services delivery, and implementation complexity inform examples. Candidate fit signals remain hypotheses until validated against actual customer and loss data.']
 ].map(([title,body])=>`<article class="method-item"><h3>${title}</h3><p>${body}</p></article>`).join('')}</div><div class="section-head"><div><h2>Reference shelf</h2><p>Public sources reviewed ${data.reviewed}. Company marketing claims are context, not evidence for our synthetic outcomes.</p></div></div><div class="source-grid">${data.sources.map(s=>`<article class="source"><div class="eyebrow blue">${s.kind}</div><h3>${s.title}</h3><p>${s.note}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">Open reference ↗</a></article>`).join('')}</div><div class="context-note"><strong>Source documents:</strong> GTM Engineer Assessment (3 pages) and JD Rocketlane: GTM Engineer (2 pages), supplied for this assessment. The job description informs the emphasis on territory planning, CRM data models, and reliable integrations. The submission does not distribute the original documents.</div>`;}
 function presentation(){const i=state.slide,s=scenarios[i-1],titles=['The thesis',...scenarios.map(s=>s.label),'Implementation','The decision standard'];let body='',note='';
 if(i===0){body=`<div class="slide-hero"><div><div class="eyebrow blue">REVENUE BY DESIGN</div><h1>Better signals.<br><span style="color:#345af4">Stronger decisions.</span></h1><p>Build a GTM engine where data is trustworthy, decisions are explainable, and failure is recoverable.</p><div class="slide-summary"><div><strong>5</strong>connected decisions</div><div><strong>200</strong>accounts to allocate</div><div><strong>1</strong>reliable operating system</div></div></div>${orbit()}</div>`;note='Open with the connected problem: five scenarios share identity, definitions, ownership, and reliable execution. Plan about 15–20 minutes; use the labs for questions.';}
 else if(s){body=`<div class="eyebrow blue">${s.number} / ${s.label.toUpperCase()}</div><h1>${s.title}</h1><div class="decision-banner"><div class="eyebrow">THE DECISION</div><div class="decision-text">${s.decision}</div></div><div class="three-grid">${s.presentation.map((p,j)=>`<div class="principle"><div class="step-num">0${j+1} /</div><p>${p}</p></div>`).join('')}</div><div class="slide-insight"><strong>Why.</strong><p>${s.why}</p></div><div style="margin-top:22px">${button('Open the live demo ↗',`data-demo="${s.id}"`,'secondary')}</div>`;note=s.presenter;}
 else if(i===6){body=`<div class="eyebrow blue">06 / IMPLEMENTATION</div><h1>Stabilise. Prove. Then scale.</h1><div class="three-grid">${[['Days 1–14','Establish trust','Reconcile the report, repair score sync, agree definitions, and triage the account pool.'],['Days 15–45','Test the decisions','Pilot scoring and territories; test stage changes and consumers before cutover.'],['Days 46–90','Institutionalise it','Review mature outcomes, activate capacity, and harden monitoring and ownership.']].map(([a,b,c])=>`<div class="principle"><div class="eyebrow blue">${a}</div><h2 style="font-size:26px;margin:17px 0">${b}</h2><p>${c}</p></div>`).join('')}</div><div class="slide-insight"><strong>Sequence.</strong><p>Live routing failures and material reporting risks first. Expand after evidence and stakeholder sign-off, with a named owner and rollback path.</p></div>`;note='These are planning windows, not delivery guarantees. Explain how dependencies and data access can change the sequence. Mature outcome evaluation may extend beyond the initial rollout.';}
 else{body=`<div class="eyebrow blue">THE DECISION STANDARD</div><h1>A system you can explain.<br>A decision you can defend.</h1><div class="three-grid">${[['Evidence','What do we know, what is missing, and what would change the recommendation?'],['Ownership','Who makes the business decision, who implements it, and who handles exceptions?'],['Reliability','How do we detect failure, recover safely, and measure the actual outcome?']].map(([a,b],j)=>`<div class="principle"><div class="step-num">0${j+1} /</div><h2 style="font-size:27px;margin-bottom:17px">${a}</h2><p>${b}</p></div>`).join('')}</div><div class="slide-insight"><strong>Discuss.</strong><p>Which assumption would you challenge first: the quality of the signal, the capacity of the team, or the reliability of the data flow?</p></div>`;note='Close on judgement and ownership. Invite a specific challenge, then use the corresponding lab. The numbers are illustrative; the value is the reasoning.';}
 return `<div class="slide-shell"><header class="slide-top">${brand()}<div class="top-actions">${button(state.notes?'Hide notes':'Speaker notes','data-action="notes"','ghost')}${button('PDF ↓','data-action="pdf"','secondary sm')}${button('Exit presentation ×','data-action="exit"','secondary sm')}</div></header><main class="slide">${body}${state.notes?`<aside class="presenter-notes"><strong>Presenter cue:</strong> ${note}</aside>`:''}</main><footer class="slide-footer"><div><div class="slide-counter">${String(i+1).padStart(2,'0')} / 08 <span style="margin-left:12px">${titles[i]}</span></div><div class="hint">← → Navigate <span style="margin:0 6px">·</span> Esc Exit <span style="margin:0 6px">·</span> N Notes</div></div><div class="slide-controls"><div class="slide-progress">${titles.map((title,j)=>`<button class="${j===i?'active':''}" data-slide="${j}" aria-label="Go to ${title}" ${j===i?'aria-current="step"':''}></button>`).join('')}</div>${button('←',`data-action="prev" aria-label="Previous slide" ${i===0?'disabled':''}`,'secondary sm')}${button('→',`data-action="next" aria-label="Next slide" ${i===7?'disabled':''}`,'sm')}</div></footer></div>`;
 }
 function render(){root.className=`app ${state.menu?'menu-open':''}`;root.innerHTML=state.present?presentation():shell(state.page==='overview'?overview():state.page==='roadmap'?roadmap():state.page==='sources'?sources():scenarioPage(scenarios.find(s=>s.id===state.page)));}
 function updateLab(){const target=root.querySelector('#lab-results');if(target)target.innerHTML=state.page==='quality'?leadResults():state.page==='territory'?territoryResults():state.page==='reliability'?reliabilityResults():systemsResults();}
 function download(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
 function downloadPdf(){if(!data.pdf){toast('PDF is not included in this build.');return;}const bytes=Uint8Array.from(atob(data.pdf),x=>x.charCodeAt(0));download(bytes,'Revenue-by-Design-presentation.pdf','application/pdf');}
 function csv(){const d=allocate(accounts,state.strategy,state.ramp),byId=new Map(d.assignments.map(a=>[a.id,a]));const rows=[['Account ID','Account name','Industry','Region','Fit','Signal','Potential proxy','Workload units','Assigned owner','Status','Rationale']];accounts.forEach(a=>{const assigned=byId.get(a.id);rows.push([a.id,a.name,a.industry,a.region,a.fit,a.intent,a.potential,a.effort,assigned?.owner||'',''+(assigned?'Assigned':'Review'),assigned?.reason||'No eligible rep with available capacity']);});download(rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'territory-allocation.csv','text/csv;charset=utf-8');}

 function slideMove(delta){state.slide=Math.max(0,Math.min(7,state.slide+delta));render();root.scrollIntoView({block:'start',behavior:'instant'});}
 const onClick=e=>{const el=e.target.closest('button,[data-account]');if(!el)return;
 if(el.dataset.nav){state.present=false;nav(el.dataset.nav,el.dataset.tab||'brief');return;}
 if(el.dataset.demo){state.present=false;nav(el.dataset.demo,'lab');return;}
 if(el.dataset.tab){state.tab=el.dataset.tab;state.search='';render();return;}
 if(el.dataset.account){state.selected=el.dataset.account;const d=allocate(accounts,state.strategy,state.ramp),a=d.assignments.find(x=>x.id===state.selected);root.querySelectorAll('[data-account]').forEach(r=>r.classList.toggle('selected',r.dataset.account===state.selected));root.querySelector('#account-detail').innerHTML=accountDetail(a);return;}
 if(el.dataset.stage!==undefined){state.stage=Number(el.dataset.stage);root.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',Number(b.dataset.stage)===state.stage));render();return;}

width:158px;padding:12px;white-space:nowrap}.orbit-card.n2{right:-66px}.orbit-card.n4{left:-66px}\n@media(max-width:400px){.hero h1{font-size:42px}.hero-copy{padding:28px 22px 0}.hero-art .orbit{transform:scale(.65)}.hero-art{min-height:260px}.hero-meta{font-size:9px}.control-panel{grid-template-columns:1fr}.stage-node{font-size:9px}}\n@media(max-width:740px){.lab-layout{grid-template-columns:1fr}.control-panel{display:grid;grid-template-columns:1fr 1fr;gap:18px}.control-panel>.eyebrow,.control-panel>.hint{grid-column:1/-1;margin:0!important}.control-panel .field{margin-bottom:0}}\n@media(max-width:400px){.control-panel{grid-template-columns:1fr}}\n</style><div id=\"gtm-app\" class=\"app\"><div class=\"boot\">Loading Revenue by Design\u2026</div></div>\n";mount({parentElement:shadow,data:{"scenarios": [{"id": "quality", "label": "Lead quality", "title": "Fix the diagnosis before the score.", "subtitle": "Separate fit, execution, and measurement before changing who reaches an AE.", "question": "Some routed leads convert poorly. Is the six-month-old scoring model wrong, or is unreliable data hiding the real cause?", "number": "01", "tag": "SIGNAL → PRIORITY", "accent": "blue", "decision": "Audit the measurement and routing path first; pilot a revised fit-and-engagement model only after the diagnosis is credible.", "why": "A scoring change can suppress good leads as easily as it filters bad ones. Higher conversion is not a win if total qualified pipeline falls or valuable accounts wait longer.", "principles": [["Define the outcome", "Agree on an AE-accepted, qualified opportunity and a fixed observation window. Compare cohorts that have had time to mature."], ["Test competing hypotheses", "Check source mix, account fit, duplicates, response time, routing ownership, and rep capacity. Sample accepted and rejected leads with Sales and Marketing."], ["Change one layer at a time", "Repair identities and source labels, benchmark the existing score, then shadow-test a simple challenger before routing on it."]], "evidence": [["Identity & lineage", "Lead/contact/account IDs, duplicate links, original source, latest source, and enrichment provenance.", "Duplicate people or accounts can distort both the denominator and rep workload. Preserve the original attribution when normalising labels."], ["Outcome & timing", "Routing timestamp, first human response, acceptance, qualification, disqualification reason, and stage history.", "Use information available at routing time. Post-conversion fields would leak the answer into a retrospective score test."], ["Cohort & execution", "Source, segment, region, assigned rep, score version, and time since routing.", "Separate changes in lead mix from changes within a comparable segment; recent cohorts need a maturity rule."]], "plan": [["Days 1–2", "RevOps + Sales + Marketing", "Agree definitions and baseline; inspect a stratified record sample and the routing workflow.", "Approved outcome definition and issue register."], ["Days 3–5", "GTM Engineering + CRM owners", "Resolve high-impact duplicates safely; normalise source labels without overwriting raw attribution; build a cohort view.", "Reconciled counts and a reproducible baseline."], ["Week 2", "GTM Engineering + Pipe Gen", "Backtest a simple fit/engagement challenger on older data, evaluate on a later mature cohort, and shadow-score new leads.", "Documented threshold trade-offs and a routing dry run."], ["Weeks 3–4+", "Sales + Marketing + RevOps", "Pilot within comparable segments; retain a control where volume allows, review rejection reasons, and expand after outcomes mature.", "Decision to scale, revise, or roll back."]], "metrics": [["Primary", "Qualified opportunities per 100 eligible routed accounts", "Evaluate total opportunity creation as well as precision."], ["Efficiency", "AE-accepted share and time spent per qualified opportunity", "Check whether rep effort improves rather than merely shifting the workload."], ["Guardrails", "Response SLA, excluded-account review, source coverage, and pipeline volume", "Keep a review path for promising accounts with missing enrichment."]], "tradeoffs": [["Precision vs coverage", "A higher threshold reduces workload but may discard valuable accounts. Size the lost opportunity and keep a monitored review band."], ["Fit vs engagement", "Strong engagement from a weak-fit account is not the same as buying suitability. Keep the components visible instead of hiding them inside one opaque number."], ["Speed vs enrichment", "Do not block a high-intent hand-raiser indefinitely while enrichment runs. Route with an explicit confidence flag or a time-bounded review path."]], "questions": [["Why not replace the model immediately?", "Model age is not evidence of model failure. First determine whether conversion differences survive cohort, identity, and execution checks."], ["Why not use machine learning?", "Start with an interpretable rule model. Consider a more complex model only if labelled volume, out-of-time performance, maintenance capacity, and incremental value justify it."], ["What would change your recommendation?", "If routing and data are reliable but mature cohorts show falling opportunity yield within the same segments, prioritise a scoring refresh."]], "context": "Rocketlane-relevant hypothesis: implementation complexity and the presence of an onboarding or services function may be useful fit signals. Validate against actual customer and loss data; employee count alone is an incomplete proxy.", "presentation": ["Poor conversion has several possible causes; score age does not identify the cause.", "Repair identity and measurement, then compare mature, like-for-like cohorts.", "Pilot a transparent challenger and protect total qualified pipeline, not just conversion rate."], "presenter": "Ask: “If we raise the score threshold and conversion improves, have we necessarily improved the business?” Open the lab to show the lost coverage."}, {"id": "territory", "label": "Territory design", "title": "Balance opportunity. Respect capacity.", "subtitle": "Allocate the next 200 accounts with a rationale you can explain to every rep.", "question": "Three AEs join next quarter. Geography is the current model, some industries show larger deals, and 200 accounts need owners.", "number": "02", "tag": "PRIORITY → OWNERSHIP", "accent": "violet", "decision": "Compare geography, industry, and hybrid designs using opportunity potential, workload, ramp, and account continuity. Start with a constrained pilot; avoid a blanket territory redraw.", "why": "Equal account counts can create unequal opportunity. Bigger industry deals may also require longer cycles, more effort, or specialist support. Fairness needs to reflect the opportunity and capacity each rep receives.", "principles": [["Validate specialisation", "Look at win rate, deal size, sales cycle, effort, and sample size by industry. Control for rep tenure and account mix before crediting industry expertise."], ["Set hard constraints first", "Respect region/language coverage, named-account commitments, parent-child account ownership, active opportunities, and available capacity."], ["Allocate and explain", "Rank the 200 accounts, assign eligible accounts against capacity, publish the rules, review exceptions, and phase activation with new-hire ramp."]], "evidence": [["Account opportunity", "Fit, relevant buying signals, estimated deal band, industry, region, parent account, and data confidence.", "Do not dress an arbitrary score as a revenue forecast. Use bands and test sensitivity where evidence is weak."], ["Rep capacity", "Current book, active opportunities, onboarding dates, ramp curve, skills, and coverage hours.", "A new hire can own future pipeline but may be unable to work a full book immediately."], ["Historical performance", "Industry cohort sizes, win rates, deal sizes, cycle length, and effort by rep and tenure.", "A few large wins do not prove a generalisable industry advantage."]], "plan": [["Week 1", "Sales leadership + RevOps", "Audit the 200 accounts and existing ownership; establish coverage constraints, success criteria, and an exception process.", "A prioritised pool with no duplicate account groups."], ["Week 2", "GTM Engineering + Sales managers", "Compare geography, industry, and hybrid scenarios; sensitivity-test potential and ramp assumptions.", "A proposed allocation with per-rep capacity and fairness review."], ["Weeks 3–4", "Sales managers + AEs", "Review account-level exceptions, preserve active deals, and publish ownership rules with a freeze date.", "Accepted books, routing dry run, and a transition log."], ["Next quarter", "Sales leadership + Enablement", "Activate accounts in ramp-aware waves; review coverage weekly and outcomes at 30/60/90 days.", "Adjustment decisions based on capacity and mature pipeline evidence."]], "metrics": [["Primary", "Opportunity potential relative to usable rep capacity", "Compare within coverage constraints; the demo uses a proxy rather than predicted revenue."], ["Execution", "Unowned priority accounts and time to first meaningful activity", "A technically assigned account is not necessarily being worked."], ["Guardrails", "Ownership churn, overloaded books, parent-account splits, and ramp progress", "Keep an appeal mechanism and protect live opportunities."]], "tradeoffs": [["Specialisation vs coverage", "Industry expertise can improve discovery but fragment regional coverage and create thin books. Keep regional eligibility and test specialist assistance before a full vertical reorganisation."], ["Fairness vs continuity", "Redistribution can equalise potential but disrupt active relationships. Freeze live opportunities and rebalance prospect pools first."], ["Precision vs false certainty", "Potential estimates are imperfect. Expose assumptions, review low-confidence high-value accounts, and avoid claiming an optimal allocation from limited data."]], "questions": [["Why not give each new hire roughly 67 accounts?", "That ignores the existing team, current workloads, coverage, and ramp. Assign based on eligible capacity and opportunity quality rather than a simple division."], ["What does fairness mean here?", "Comparable opportunity per usable capacity, subject to agreed coverage and continuity rules. It does not mean identical books or guaranteed identical results."], ["What would change your recommendation?", "Strong repeated industry performance across reps and mature cohorts could justify dedicated vertical books. Weak evidence favours a geographic base with specialist support."]], "context": "Rocketlane-relevant example: SaaS implementation teams and services organisations can require different discovery. Use that distinction to test expertise needs; do not assume it must become a permanent territory boundary.", "presentation": ["The assignment is 200 accounts and three hires; the objective is productive coverage.", "Balance opportunity against capacity while preserving geographic eligibility and live deals.", "Use specialisation only where evidence and book density justify it."], "presenter": "Change from Geography to Hybrid, then reduce new-hire capacity. Explain which constraint creates the trade-off. The simulator is a transparent heuristic, not a revenue optimiser."}, {"id": "reliability", "label": "Reporting reliability", "title": "Make uncertainty visible. Then act.", "subtitle": "Deliver a decision-useful quarterly report without inventing precision.", "question": "Close dates are unreliable, some opportunities have no stage, and teams disagree on what “qualified” means. Leadership still needs the report.", "number": "03", "tag": "OWNERSHIP → TRUST", "accent": "teal", "decision": "Publish an as-of snapshot with a reconciled total, explicit quality exceptions, and scenario bounds. Prioritise material owner-verified fixes before the reporting cutoff.", "why": "Waiting for perfect data delays decisions. Silently removing questionable records hides exposure. A useful report separates what is recorded, what is supportable, and what still requires judgement.", "principles": [["Freeze and reconcile", "Record the extraction time, currency basis, scope, and definitions. Reconcile the full opportunity total before applying any quality filters."], ["Size the uncertainty", "Quantify missing stages, suspect close dates, and qualification-definition exceptions by value and count. Show overlaps so issues are not double-counted."], ["Fix what changes a decision", "Review the largest material exceptions with Sales owners. Publish caveats, accountable owners, and a dated remediation plan for the rest."]], "evidence": [["Snapshot contract", "As-of timestamp, amount currency, open/closed rules, quarter boundary, and extraction completeness.", "Leadership must be able to distinguish a source change from a reporting-definition change."], ["Opportunity exceptions", "Missing stage, overdue close date, repeated pushes, stale activity, missing next step, and qualification evidence.", "A missing field may indicate a process problem, not simply a data-entry omission."], ["Definition agreement", "A documented qualification standard and stage evidence agreed by Sales, Marketing, Finance, and RevOps.", "Report separate populations until definitions are aligned; do not silently combine incompatible metrics."]], "plan": [["First 24 hours", "RevOps + Finance", "Freeze the snapshot, reconcile total pipeline, quantify issue exposure, and agree the reporting cutoff.", "Report scope and materiality rules."], ["Before cutoff", "Sales managers + opportunity owners", "Validate the highest-value exceptions; retain a record of corrections and unresolved items.", "A materially improved view with an exception appendix."], ["At publication", "RevOps + leadership", "Present total recorded pipeline, quality-screened pipeline, scenario assumptions, and unresolved exposure.", "A decision-useful report with clearly limited claims."], ["Next 2–4 weeks", "CRM owners + functional leaders", "Agree qualification evidence, introduce stage-aware validation, monitor freshness, and assign weekly ownership.", "A recurring data-quality scorecard and declining exception exposure."]], "metrics": [["Primary", "Pipeline value affected by unresolved material exceptions", "Count distinct opportunities and show overlap between issue types."], ["Reliability", "Reconciliation coverage and correction turnaround", "Make every exclusion explainable; retain a snapshot before corrections."], ["Guardrails", "Rep friction, bypass behaviour, and definition adoption", "Do not require a guessed value merely to make a completeness dashboard green."]], "tradeoffs": [["Timeliness vs precision", "Publish on time with decision-relevant caveats; defer only a decision whose missing evidence is material to that decision."], ["Validation vs burden", "Require evidence at meaningful stage transitions. Overly rigid requirements encourage placeholder data and reduce actual reliability."], ["Completeness vs confidence", "A fully populated record may still be wrong. Keep field-quality screening separate from probability of closing."]], "questions": [["Can we call the clean subtotal the forecast?", "No. Passing completeness and freshness rules does not validate close probability. The lab shows quality-screened pipeline and explicit scenarios, not a calibrated forecast."], ["What do you tell leadership?", "State the recorded total, the material exposure, the decisions the report supports, and what remains uncertain. Give owners and dates for resolution."], ["What would change your recommendation?", "If a few disputed deals dominate the quarter, prioritise their verification and present decision scenarios rather than relying on a single aggregate number."]], "context": "For a services-oriented business, distinguish sales opportunity timing from project delivery, billing, and revenue recognition. A CRM close date alone does not establish a finance revenue forecast.", "presentation": ["Freeze and reconcile the full population before editing or filtering it.", "Quantify distinct exposure and prioritise exceptions that can change a decision.", "Publish scenarios with assumptions; completeness is not forecast confidence."], "presenter": "Toggle the screened view. The unresolved portion remains visible, and the total still reconciles. Avoid calling the clean subtotal “guaranteed” or “forecast”."}, {"id": "stages", "label": "Stage alignment", "title": "More visibility. Comparable history.", "subtitle": "Give Sales useful granularity while protecting the meaning of reporting.", "question": "Sales wants seven stages instead of five. Marketing needs model continuity, and Finance wants consistent historical reporting.", "number": "04", "tag": "PROCESS → SHARED MEANING", "accent": "amber", "decision": "Define buyer-evidence-based stages, preserve raw history, and introduce a versioned reporting crosswalk. Pilot downstream changes before the cutover.", "why": "Stage names affect automations, conversion denominators, forecast probabilities, and trend reporting. Adding labels without agreeing their meaning spreads disagreement into every connected system.", "principles": [["Align on the decisions", "Ask which blind spots the extra stages resolve. Agree entry/exit criteria and owners before editing the CRM picklist."], ["Separate detail from comparison", "Keep the operational seven-stage path and a stable analytical roll-up where definitions align. Mark mapping ambiguity explicitly."], ["Version and cut over", "Preserve original stage values and timestamps, test downstream logic, dual-run reports, and document a reversible migration."]], "evidence": [["Dependency inventory", "CRM automation, integrations, stage-duration reporting, forecast probabilities, attribution, and Marketing models.", "A new stage can change rules even if the total opportunity amount is unchanged."], ["Stage contract", "Buyer evidence, exit criteria, allowed transitions, owner, and exceptions for each proposed stage.", "“Demo completed” is an activity; evidence of customer evaluation is a stronger stage criterion."], ["Historical basis", "Existing stage history, definitions, model versions, and any evidence supporting a retrospective split.", "Do not invent the two new historical sub-stages if the evidence was never captured."]], "plan": [["Week 1", "Sales + Marketing + Finance + RevOps", "Document visibility needs, define stage evidence, and inventory consumers.", "Signed definitions and a decision log."], ["Week 2", "GTM Engineering + Analytics", "Build a versioned crosswalk and test on a snapshot; update models and automations in a sandbox.", "Reconciled totals, documented ambiguities, and a rollback package."], ["Weeks 3–4", "Sales pilot team + reporting owners", "Pilot the process, train reps, dual-run reports, and approve the cutover after sign-off.", "Validated consumer behaviour and an explicit go/no-go."], ["After cutover", "RevOps + model owners", "Watch stage usage and bypasses; recalibrate probabilities only as new cohorts mature.", "A process review and model-performance review."]], "metrics": [["Primary", "Consistent classification and reliable stage evidence", "Sample records and monitor disagreements, not just field completion."], ["Continuity", "Reconciled totals and explainable trend breaks", "Verify amount conservation; distinguish a schema change from genuine performance change."], ["Guardrails", "Broken workflows, invalid transitions, and reporting drift", "A rollback must restore rules and mappings without deleting events recorded after cutover."]], "tradeoffs": [["Granularity vs adoption", "Seven stages may add effort without improving decisions. Keep a stage only if it has distinct evidence and an operational use."], ["Historical detail vs honesty", "Roll new detail up for comparison where possible. Leave old records at their known level instead of fabricating a retrospective split."], ["Consistency vs changed meaning", "A crosswalk cannot repair fundamentally different definitions. Flag non-comparable periods and obtain agreement on a new baseline."]], "questions": [["Does a 7→5 crosswalk solve everything?", "Only when the definitions genuinely align. It preserves comparable aggregation, not information that was never observed."], ["Should old stage probabilities carry over?", "Not automatically. Use provisional documented assumptions, then validate probabilities on mature cohorts under the new definitions."], ["Who decides when teams disagree?", "RevOps facilitates evidence and options; the accountable revenue sponsor resolves scope and trade-offs, with Finance and Marketing sign-off on their reporting dependencies."]], "context": "If sales handoff triggers customer implementation workflows, include delivery operations in the dependency review. A stage change should not accidentally launch, duplicate, or delay a customer project.", "presentation": ["Agree what the two additional stages mean and which decisions they improve.", "Preserve the raw events; use a versioned crosswalk for comparable aggregation.", "A mapping cannot manufacture missing historical detail or validate new probabilities."], "presenter": "Select the split Evaluation stage. Show that today’s Discovery and Validation both roll up, while historical records remain at the old known level."}, {"id": "systems", "label": "Systems strategy", "title": "Repair the flow. Build the foundation.", "subtitle": "Make score-to-routing reliable before undertaking a larger architecture change.", "question": "HubSpot scores are needed in Salesforce, the warehouse is disconnected, and routing and conversion tracking suffer. What comes first?", "number": "05", "tag": "SYSTEMS → RELIABLE EXECUTION", "accent": "blue", "decision": "Stabilise the operational score-to-routing path with field ownership, identity matching, freshness checks, and observable recovery; evolve analytics in parallel.", "why": "A warehouse redesign does not immediately get a fresh score to a rep. A quick sync without ownership and failure handling can make bad routing happen faster.", "principles": [["Map the critical path", "Trace score creation, matching, sync eligibility, CRM write, assignment, and acceptance. Inspect the native connector and existing mappings first."], ["Define a field contract", "Choose one authoritative writer per field; carry a score version and timestamp, canonical IDs, origin, and a processing status."], ["Make recovery deliberate", "Use duplicate-event protection, bounded retries, failed-event review, reconciliation, and routing rules that handle stale or missing data."]], "evidence": [["Integration inventory", "Existing connector settings, inclusion filters, mappings, sync direction, licences, API limits, and error logs.", "Validate tool and edition capabilities before adding a custom service."], ["Identity & ownership", "Canonical account/person IDs, lead-to-contact conversion links, parent accounts, and per-field authority.", "Email and company domain can be matching signals; neither is a universal canonical identifier."], ["Service expectations", "Which routing decisions need minutes, acceptable stale-score age, failure escalation, and recovery ownership.", "Latency targets should follow business need and measured capacity, not an arbitrary “real-time” promise."]], "plan": [["Days 1–3", "GTM Engineering + Marketing Ops + CRM owner", "Trace a sample end to end, inspect sync errors, agree field authority, and repair the most material mapping or eligibility issue.", "A documented score contract and working critical path."], ["Weeks 1–2", "GTM Engineering + Sales Ops", "Add freshness/version checks, deduplication, retry limits, failed-event handling, and daily reconciliation.", "A monitored pilot with failure drills and a rollback path."], ["Weeks 3–6", "Analytics + GTM Engineering", "Create canonical cross-system IDs and historical event models; align attribution and conversion definitions.", "Warehouse models that reconcile to the operational systems."], ["Weeks 6–12", "RevOps + platform owners", "Consolidate overlapping flows where justified; harden service ownership, alerts, access scopes, and change management.", "A roadmap based on measured reliability and maintenance costs."]], "metrics": [["Primary", "Eligible scores arriving in Salesforce within the agreed SLA", "Define the denominator and compare source vs destination values and timestamps."], ["Recovery", "Failure rate, oldest unresolved event, and time to recovery", "Alerts need an owner, a runbook, and a path to replay after correction."], ["Guardrails", "Duplicate assignments, stale-score routes, and conversion reconciliation", "A successful API response alone does not prove the business workflow succeeded."]], "tradeoffs": [["Native connector vs custom code", "Prefer the existing connector when it satisfies the contract. Add orchestration only for validated gaps; custom code creates an ownership and maintenance obligation."], ["Freshness vs availability", "Do not silently treat an old score as current. Use a time-bounded review or documented fallback so a high-intent lead is not stranded."], ["Operational path vs warehouse", "Keep time-sensitive routing off an unproven batch dependency. Use the warehouse for history, measurement, and reconciliation; change this only if latency and ownership requirements are satisfied."]], "questions": [["What is idempotency here?", "Processing the same source event again must not create another assignment. Track an event ID and score version so replay can be safe."], ["What about out-of-order events?", "Compare score version and source timestamp before writing. Ignore an older event rather than letting it overwrite a newer score."], ["What would change your recommendation?", "If the native integration cannot meet required identity, eligibility, or latency rules, add a small monitored adapter instead of replacing the entire stack."]], "context": "Rocketlane has public Salesforce and HubSpot integrations, but this assessment describes a hypothetical internal stack. Do not imply that the scenario is a verified account of Rocketlane’s production architecture.", "presentation": ["Fix the shortest business-critical path: fresh score → correct record → eligible owner.", "Assign field authority and make stale, duplicate, failed, and out-of-order events explicit.", "Build canonical history and reconciliation without making routing wait for a large rebuild."], "presenter": "Run a failed CRM write, then retry it. Next replay a duplicate. Explain why success means one correct routing decision, not just a green sync response."}], "sources": [{"title": "Rocketlane platform", "kind": "Company context", "url": "https://www.rocketlane.com/", "note": "Public positioning: onboarding, professional services automation, and agentic service delivery. Reviewed 5 November 2026."}, {"title": "Onboarding & implementation", "kind": "Company context", "url": "https://www.rocketlane.com/onboarding-implementation-software", "note": "Customer collaboration, time-to-value, project templates, and CRM-triggered handoffs."}, {"title": "Professional services", "kind": "Company context", "url": "https://www.rocketlane.com/professional-services-automation-software", "note": "Project, resource, time, and profitability use cases."}, {"title": "GoCardless customer story", "kind": "Illustrative customer context", "url": "https://www.rocketlane.com/customers/how-gocardless-scaled-professional-services-to-deliver-59-faster-time-to-value", "note": "Example of disconnected plans and manual reporting challenges; not used to infer internal GTM performance."}, {"title": "Streamlit custom components", "kind": "Implementation reference", "url": "https://docs.streamlit.io/develop/concepts/custom-components/overview", "note": "Custom frontend hosted inside Streamlit using a v2 component."}, {"title": "Streamlit Community Cloud deployment", "kind": "Hosting reference", "url": "https://docs.streamlit.io/deploy/streamlit-community-cloud/deploy-your-app", "note": "Repository-based deployment with app.py and pinned requirements."}], "reviewed": "5 November 2026", "title": "Revenue by Design", "pdf": "JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiswIDE5IDAgUiAvRjMrMCAyMyAwIFIKPj4KZW5kb2JqCjIgMCBvYmoKPDwKL0Jhc2VGb250IC9IZWx2ZXRpY2EgL0VuY29kaW5nIC9XaW5BbnNpRW5jb2RpbmcgL05hbWUgL0YxIC9TdWJ0eXBlIC9UeXBlMSAvVHlwZSAvRm9udAo+PgplbmRvYmoKMyAwIG9iago8PAovQ29udGVudHMgMjcgMCBSIC9NZWRpYUJveCBbIDAgMCAxMjgwIDcyMCBdIC9QYXJlbnQgMjYgMCBSIC9SZXNvdXJjZXMgPDwKL0ZvbnQgMSAwIFIgL1Byb2NTZXQgWyAvUERGIC9UZXh0IC9JbWFnZUIgL0ltYWdlQyAvSW1hZ2VJIF0KPj4gL1JvdGF0ZSAwIC9UcmFucyA8PAoKPj4gCiAgL1R5cGUgL1BhZ2UKPj4KZW5kb2JqCjQgMCBvYmoKPDwKL0NvbnRlbnRzIDI4IDAgUiAvTWVkaWFCb3ggWyAwIDAgMTI4MCA3MjAgXSAvUGFyZW50IDI2IDAgUiAvUmVzb3VyY2VzIDw8Ci9Gb250IDEgMCBSIC9Qcm9jU2V0IFsgL1BERiAvVGV4dCAvSW1hZ2VCIC9JbWFnZUMgL0ltYWdlSSBdCj4+IC9Sb3RhdGUgMCAvVHJhbnMgPDwKCj4+IAogIC9UeXBlIC9QYWdlCj4+CmVuZG9iago1IDAgb2JqCjw8Ci9Db250ZW50cyAyOSAwIFIgL01lZGlhQm94IFsgMCAwIDEyODAgNzIwIF0gL1BhcmVudCAyNiAwIFIgL1Jlc291cmNlcyA8PAovRm9udCAxIDAgUiAvUHJvY1NldCBbIC9QREYgL1RleHQgL0ltYWdlQiAvSW1hZ2VDIC9JbWFnZUkgXQo+PiAvUm90YXRlIDAgL1RyYW5zIDw8Cgo+PiAKICAvVHlwZSAvUGFnZQo+PgplbmRvYmoKNiAwIG9iago8PAovQ29udGVudHMgMzAgMCBSIC9NZWRpYUJveCBbIDAgMCAxMjgwIDcyMCBdIC9QYXJlbnQgMjYgMCBSIC9SZXNvdXJjZXMgPDwKL0ZvbnQgMSAwIFIgL1Byb2NTZXQgWyAvUERGIC9UZXh0IC9JbWFnZUIgL0ltYWdlQyAvSW1hZ2VJIF0KPj4gL1JvdGF0ZSAwIC9UcmFucyA8PAoKPj4gCiAgL1R5cGUgL1BhZ2UKPj4KZW5kb2JqCjcgMCBvYmoKPDwKL0NvbnRlbnRzIDMxIDAgUiAvTWVkaWFCb3ggWyAwIDAgMTI4MCA3MjAgXSAvUGFyZW50IDI2IDAgUiAvUmVzb3VyY2VzIDw8Ci9Gb250IDEgMCBSIC9Qcm9jU2V0IFsgL1BERiAvVGV4dCAvSW1hZ2VCIC9JbWFnZUMgL0ltYWdlSSBdCj4+IC9Sb3RhdGUgMCAvVHJhbnMgPDwKCj4+IAogIC9UeXBlIC9QYWdlCj4+CmVuZG9iago4IDAgb2JqCjw8Ci9Db250ZW50cyAzMiAwIFIgL01lZGlhQm94IFsgMCAwIDEyODAgNzIwIF0gL1BhcmVudCAyNiAwIFIgL1Jlc291cmNlcyA8PAovRm9udCAxIDAgUiAvUHJvY1NldCBbIC9QREY
